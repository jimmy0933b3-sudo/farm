name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Newer main commits supersede builds which cannot publish an old Release.
concurrency:
  group: animal-island-build-${{ github.event_name == 'pull_request' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android API
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Validate Godot imports and script syntax
        run: |
          godot --version
          godot --headless --editor --path . --import --quit
      - name: Check startup, zoo art and ocean map scripts directly
        run: |
          godot --headless --path . --check-only --script scripts/Backdrop.gd
          godot --headless --path . --check-only --script scripts/AnimalArt.gd
          godot --headless --path . --check-only --script scripts/OceanMap.gd
          godot --headless --path . --check-only --script scripts/Main.gd
      - name: Check private farm and roaming actor GDScript parsing
        run: |
          godot --headless --path . --check-only --script scripts/RoamingAnimal.gd
          godot --headless --path . --check-only --script scripts/PrivateFarm.gd
      - name: Run game data tests
        run: godot --headless --path . --script tests/validate.gd
      - name: Configure Android paths
        run: godot --headless --editor --path . --script tools/configure_android.gd
      - name: Test touch animal lists, scroll gesture safety and Ocean Park
        run: timeout --signal=TERM 90s godot --headless --path . --script tests/animal_scroll_smoke.gd
      - name: Exercise all picture-choice levels
        run: |
          godot --headless --path . --script tests/ui_smoke.gd
      - name: Check touch petting and persistent care animations
        run: godot --headless --path . --script tests/interaction_smoke.gd
      - name: Test parental settings vertical scrolling and retained position
        run: godot --headless --path . --script tests/parent_scroll_smoke.gd
      - name: Test multiple animal expressions and playful care animation
        run: godot --headless --path . --script tests/animal_reactions_smoke.gd
      - name: Test forest animal discovery mini-game
        run: godot --headless --path . --script tests/forest_discovery_smoke.gd
      - name: Test independent large forest adventure
        run: godot --headless --path . --script tests/large_forest_smoke.gd
      - name: Check Zoo discovery, panorama and hiding spot scripts
        run: |
          godot --headless --path . --check-only --script scripts/ZooDiscovery.gd
          godot --headless --path . --check-only --script scripts/ZooMap.gd
          godot --headless --path . --check-only --script scripts/ZooHideSpot.gd
          godot --headless --path . --check-only --script scripts/InsectDiscovery.gd
          godot --headless --path . --check-only --script scripts/InsectMap.gd
          godot --headless --path . --check-only --script scripts/InsectHideSpot.gd
      - name: Test zoo find-six gameplay, save, resume and replay
        run: godot --headless --path . --script tests/zoo_search_smoke.gd
      - name: Verify insect-specific Mandarin narration in all activity screens
        run: godot --headless --path . --script tests/insect_narration_smoke.gd
      - name: Test insect park icons and original colorable portraits
        run: godot --headless --path . --script tests/insect_park_smoke.gd
      - name: Test seven-insect seek-and-find lifecycle, save migration and persistence
        run: godot --headless --path . --script tests/insect_search_smoke.gd
      - name: Test Zoo Park six animals, shared monkey and seal lifecycle
        run: godot --headless --path . --script tests/zoo_seal_smoke.gd
      - name: Test ocean discovery and pond swimmers
        run: godot --headless --path . --script tests/ocean_smoke.gd
      - name: Test landscape UI boundaries and no white hideout buttons
        run: godot --headless --path . --script tests/layout_smoke.gd
      - name: Test separated park header and distinct squirrel/fox original silhouettes
        run: godot --headless --path . --script tests/species_art_smoke.gd
      - name: Test flying insects, crawling mantis, rolling dung beetle and distinct beetles
        run: godot --headless --path . --script tests/flying_insects_smoke.gd
      - name: Test larger private farm sideways panning and direct petting
        run: godot --headless --path . --script tests/private_farm_pan_smoke.gd
      - name: Test expanded farm capacity and 16-slot resident selector
        run: godot --headless --path . --script tests/private_farm_layout_smoke.gd
      - name: Test private farm placement, petting, care and saved residents
        run: godot --headless --path . --script tests/private_farm_smoke.gd
      - name: Check kart race, track, lobby and vehicle parsing
        run: |
          godot --headless --path . --check-only --script scripts/RaceRules.gd
          godot --headless --path . --check-only --script scripts/RaceTrack.gd
          godot --headless --path . --check-only --script scripts/RaceVehicle.gd
          godot --headless --path . --check-only --script scripts/RaceLobby.gd
          godot --headless --path . --check-only --script scripts/RaceGame.gd
          godot --headless --path . --check-only --script scripts/RaceEffects.gd
          godot --headless --path . --check-only --script scripts/RaceSounds.gd
          godot --headless --path . --check-only --script scripts/RacePodium.gd
          godot --headless --path . --check-only --script scripts/MonsterArt.gd
          godot --headless --path . --check-only --script scripts/MonsterScenery.gd
          godot --headless --path . --check-only --script scripts/MonsterWorld.gd
          godot --headless --path . --check-only --script scripts/MonsterAlbum.gd
          godot --headless --path . --check-only --script scripts/MonsterAbilityEffects.gd
          godot --headless --path . --check-only --script scripts/BirdArt.gd
          godot --headless --path . --check-only --script scripts/BirdScenery.gd
          godot --headless --path . --check-only --script scripts/BirdWorld.gd
          godot --headless --path . --check-only --script scripts/BirdAlbum.gd
          godot --headless --path . --check-only --script scripts/BirdFlightLobby.gd
          godot --headless --path . --check-only --script scripts/BirdFlightTrack.gd
          godot --headless --path . --check-only --script scripts/BirdFlightGame.gd
          godot --headless --path . --check-only --script scripts/GardenRules.gd
          godot --headless --path . --check-only --script scripts/CropArt.gd
          godot --headless --path . --check-only --script scripts/GardenWorld.gd
      - name: Test every collected animal and insect is eligible to race
        run: timeout --signal=TERM 30s godot --headless --path . --script tests/race_roster_smoke.gd
      - name: Audit unique vector drawings of all eight old and new insects
        run: timeout --signal=TERM 45s godot --headless --path . --script tests/insect_icon_uniqueness_smoke.gd
      - name: Test Private Farm race navigation, AI, controls and saved podium
        run: timeout --signal=TERM 75s godot --headless --path . --script tests/race_smoke.gd
      - name: Test monster exploration, collection, gallery and racing
        run: timeout --signal=TERM 75s godot --headless --path . --script tests/monster_smoke.gd
      - name: Test Bird World, bird album, flight controls and persistent sky races
        run: timeout --signal=TERM 75s godot --headless --path . --script tests/bird_smoke.gd
      - name: Test vegetable garden, watering, harvest saves and happy animal feeding
        run: timeout --signal=TERM 75s godot --headless --path . --script tests/garden_smoke.gd
      - name: Check guided drawing mini-game GDScript parsing
        run: |
          godot --headless --path . --check-only --script scripts/DrawingLessonCanvas.gd
          godot --headless --path . --check-only --script scripts/DrawingStudio.gd
      - name: Test drawing academy steps, real traces, decorations and saved artwork
        run: godot --headless --path . --script tests/drawing_academy_smoke.gd
      - name: Check coloring canvas and room syntax
        run: |
          godot --headless --path . --check-only --script scripts/ColoringCanvas.gd
          godot --headless --path . --check-only --script scripts/ColoringRoom.gd
      - name: Test all animal body parts can be painted
        run: godot --headless --path . --script tests/coloring_regions_smoke.gd
      - name: Test paint strokes never bleed into neighboring animal parts
        run: godot --headless --path . --script tests/coloring_boundary_smoke.gd
      - name: Test black-white coloring game, touch fill and autosave
        run: godot --headless --path . --script tests/coloring_smoke.gd
      - name: Test cola pet park, axolotl and full shared animal album and coloring roster
        run: timeout --signal=TERM 100s godot --headless --path . --script tests/park_catalog_smoke.gd
      - name: Launch game smoke test
        run: |
          godot --headless --path . --quit-after 8 > "$RUNNER_TEMP/game-smoke.log" 2>&1
          cat "$RUNNER_TEMP/game-smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access' "$RUNNER_TEMP/game-smoke.log"; then
            echo "Game runtime errors detected"
            exit 1
          fi
      - name: Diagnose Android configuration
        run: |
          echo "Android SDK: $ANDROID_HOME; JDK: $JAVA_HOME"
          ls -l "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          find "$HOME/.config/godot" -maxdepth 2 -type f -name 'editor_settings*' -print -exec grep -E 'export/android/(java_sdk_path|android_sdk_path)' {} \; || true
          godot --headless --editor --path . --script tools/check_android.gd
      # Only trusted branch builds may use signing secrets. PRs run tests only.
      - name: Prepare fixed signing key and increment Android version
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: python3 tools/prepare_signing.py

      - name: Export signed Android release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/animal-island-release.p12
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          test -s "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
          godot --headless --path . --export-release Android build/AnimalAdventureIsland-signed.apk
          test -s build/AnimalAdventureIsland-signed.apk

      - name: Verify APK package and keystore certificate
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: python3 tools/verify_signed_apk.py

      - name: Upload upgradeable signed APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AnimalAdventureIsland-signed-APK
          path: |
            build/AnimalAdventureIsland-signed.apk
            build/SIGNING-INFO.txt
          if-no-files-found: error
          retention-days: 90

      # Only after signing verification: publish a real GitHub Release.
      # Do not delete the previous good APK unless upload succeeds.
      - name: Publish only latest signed APK as GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -s build/AnimalAdventureIsland-signed.apk
          test -s build/SIGNING-INFO.txt
          current="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq .object.sha)"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "A newer commit is on main. Skipping stale Release."
            exit 0
          fi
          tag="v0.6.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            "build/AnimalAdventureIsland-signed.apk" \
            "build/SIGNING-INFO.txt" \
            --target "$GITHUB_SHA" \
            --title "動物探險島 ${tag}｜最新版 APK" \
            --notes "含八種昆蟲（新增象鼻蟲）、昆蟲大探險、全部已收集角色皆可賽車、動物園找動物、16 隻私人農場與 30 色手指著色。已通過 GitHub Actions 遊戲測試與固定簽章驗證。直接下載 AnimalAdventureIsland-signed.apk 安裝或升級。" \
            --latest
          # Cleanup only AFTER release creation succeeds.
          while IFS= read -r old; do
            [[ -z "$old" || "$old" == "$tag" ]] && continue
            gh release delete "$old" --yes --cleanup-tag
            echo "Removed older Release $old"
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          gh release view "$tag" --json url,assets --jq '{url, assets:[.assets[].name]}'
          echo "LATEST_APK=https://github.com/${GH_REPO}/releases/latest" >> "$GITHUB_ENV"
      # Keep exactly one successful signed APK archive (latest workflow run).
      # Cleanup runs ONLY after all tests, export, verification and artifact
      # upload succeeded; previous working APK remains if any step fails.
      - name: Remove older signed APK artifacts
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const name = 'AnimalAdventureIsland-signed-APK';
            const all = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            const apks = all.filter(item => item.name === name && !item.expired);
            if (apks.length < 2) {
              core.info('Only one signed APK artifact exists, nothing to delete.');
              return;
            }
            // Use workflow RUN IDs instead of upload timestamps: an older
            // queued run may finish uploading after a newer commit's run.
            apks.sort((a,b) =>
              (Number(b.workflow_run?.id || 0) - Number(a.workflow_run?.id || 0)) ||
              (Number(b.id) - Number(a.id))
            );
            const latest = apks[0];
            core.info('Keeping APK artifact '+latest.id+' from run '+latest.workflow_run?.id);
            for (const old of apks.slice(1)) {
              await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: old.id });
              core.info('Deleted older signed APK artifact '+old.id);
            }
            core.info('Retained 1 latest signed APK; removed '+(apks.length-1)+' older archives.');

