name: Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK command line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
          packages: ''
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install Android API
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot and templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.2
          use-dotnet: false
          include-templates: true
      - name: Validate Godot imports and script syntax
        run: |
          godot --version
          godot --headless --editor --path . --import --quit
      - name: Run game data tests
        run: godot --headless --path . --script tests/validate.gd
      - name: Configure Android paths
        run: godot --headless --editor --path . --script tools/configure_android.gd
      - name: Create Android debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Exercise all picture-choice levels
        run: |
          godot --headless --path . --script tests/ui_smoke.gd
      - name: Check touch petting and persistent care animations
        run: godot --headless --path . --script tests/interaction_smoke.gd
      - name: Test forest animal discovery mini-game
        run: godot --headless --path . --script tests/forest_discovery_smoke.gd
      - name: Launch game smoke test
        run: |
          godot --headless --path . --quit-after 8 > "$RUNNER_TEMP/game-smoke.log" 2>&1
          cat "$RUNNER_TEMP/game-smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|Invalid access' "$RUNNER_TEMP/game-smoke.log"; then
            echo "Game runtime errors detected"
            exit 1
          fi
      - name: Diagnose Android configuration
        run: |
          echo "Android SDK: $ANDROID_HOME; JDK: $JAVA_HOME"
          ls -l "$ANDROID_HOME/platform-tools/adb" "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          find "$HOME/.config/godot" -maxdepth 2 -type f -name 'editor_settings*' -print -exec grep -E 'export/android/(java_sdk_path|android_sdk_path)' {} \; || true
          godot --headless --editor --path . --script tools/check_android.gd
      - name: Export installable debug APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug Android build/AnimalAdventureIsland-debug.apk
          test -s build/AnimalAdventureIsland-debug.apk
      - name: Verify APK signature
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose build/AnimalAdventureIsland-debug.apk
      - name: Optional release signing
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        run: echo "release secrets available"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimalAdventureIsland-debug-APK
          path: build/*.apk
          if-no-files-found: error
          retention-days: 30
